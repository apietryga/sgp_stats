name: Update data

# Refreshes the published "hard data" (docs/**) by re-running the full pipeline
# and committing any resulting change. GitHub Pages (Deploy from branch main
# /docs) redeploys automatically on the push — no deploy step needed here.
on:
  schedule:
    # Weekly, Sunday 06:00 UTC. SGP rounds are typically Saturday, so this picks
    # up new results the morning after. Runs year-round harmlessly: off-season
    # runs produce no diff, so nothing is committed.
    - cron: "0 6 * * SUN"
  # Every push to main also re-runs the pipeline, so a code change (e.g. this
  # workflow's own fixes) picks up whatever's newest on fimspeedway right
  # away instead of waiting for Sunday. Guarded below against the bot's own
  # data-refresh commits to avoid a push -> commit -> push loop.
  push:
    branches: [main]
  # Manual on-demand trigger (the "button"): Actions tab → Run workflow, or
  # `gh workflow run update-data.yml`. No token embedded anywhere.
  workflow_dispatch: {}

# Never let two refresh runs race on the same branch.
concurrency:
  group: update-data
  cancel-in-progress: false

permissions:
  contents: write # needed to push regenerated docs/ back to the branch

jobs:
  refresh:
    runs-on: ubuntu-latest
    # Skip runs triggered by the bot's own data-refresh commit — otherwise
    # every push-triggered commit would immediately trigger another run.
    if: >-
      github.event_name != 'push' ||
      !startsWith(github.event.head_commit.message, 'chore(data): scheduled refresh')
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install JS deps
        run: bun install --frozen-lockfile

      # TODO(temporary): investigating a fallback for scrape:official, since
      # fimspeedway's season API no longer embeds per-race results for the
      # in-progress 2026 season (see PR #6/#7). Round 2 (probe_fim_dom.ts)
      # found the per-round results page DOES embed full heat data (rankings,
      # colorId, rider names) in its __NEXT_DATA__ script tag. Round 3
      # (probe_fim_nextdata.ts) checks whether a plain fetch already returns
      # it (no browser needed) and dumps the exact JSON shape under
      # pageProps, to see if it matches the already-written but unused
      # extractRound()/parseNextData() in fimspeedway.ts. Remove once the
      # fallback is implemented (or the approach is abandoned).
      - name: Install Playwright chromium (temporary, for probe)
        run: bunx playwright install --with-deps chromium

      - name: Probe a 2026 round results page's __NEXT_DATA__ (temporary)
        run: bun run scripts/probe_fim_nextdata.ts "https://fimspeedway.com/results/2026-dewalt-fim-speedway-gp-of-latvia-riga"

      - name: Run full pipeline (rebuild data + site)
        # Network steps (scrape:official, scrape:wiki) are best-effort inside
        # pipeline.ts; a source being down does not fail the job. build:site's
        # regression guard (src/build_site.ts) can still fail the job on
        # purpose if the result would publish less than what's already live —
        # see the debug-raw-scrape-payloads artifact below when that happens.
        run: bun run all

      - name: Upload raw scrape payloads for debugging (only on failure)
        # The regression guard exists precisely because scrape:official can
        # come back structurally valid but empty of heats for a season (seen
        # for 2026 while it's in progress). Nothing here has network access
        # to fimspeedway.com outside CI, so save what this run actually
        # fetched — data/raw/*.json — to inspect the real API shape offline.
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: debug-raw-scrape-payloads
          path: data/raw/*.json
          retention-days: 14
          if-no-files-found: warn

      - name: Commit & push updated data (only if changed)
        run: |
          git config user.name  "sgp-stats bot"
          git config user.email "antoni.pietryga@linkhouse.co"
          if [ -n "$(git status --porcelain docs/)" ]; then
            git add docs/
            git commit -m "chore(data): scheduled refresh of published data"
            git push
          else
            echo "No data changes — nothing to commit."
          fi
