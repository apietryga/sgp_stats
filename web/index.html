<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>SGP Elo — Speedway Grand Prix 1995–2026</title>
<style>
  :root {
    --bg: #0d1117; --panel: #161b22; --line: #21262d; --fg: #e6edf3;
    --muted: #7d8590; --accent: #d29922; --hi: #2f81f7;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg);
    font: 14px/1.45 -apple-system, system-ui, sans-serif; }
  header { padding: 18px 22px 10px; border-bottom: 1px solid var(--line); }
  h1 { font-size: 16px; margin: 0; font-weight: 600; }
  .sub { color: var(--muted); font-size: 12px; margin-top: 3px; }
  .nav { margin-top: 8px; font-size: 12px; }
  .nav a { color: var(--hi); text-decoration: none; }
  .nav a:hover { text-decoration: underline; }
  .controls { display: flex; gap: 14px; align-items: center; flex-wrap: wrap;
    padding: 12px 22px; border-bottom: 1px solid var(--line); }
  input[type="text"] { background: var(--panel); border: 1px solid var(--line);
    color: var(--fg); padding: 6px 10px; border-radius: 6px; min-width: 200px; font: inherit; }
  label.toggle { color: var(--muted); display: flex; gap: 6px; align-items: center; cursor: pointer; }
  input[type="number"] { background: var(--panel); border: 1px solid var(--line);
    color: var(--fg); padding: 5px 6px; border-radius: 6px; width: 52px; font: inherit;
    text-align: right; }
  .count { color: var(--muted); font-size: 12px; margin-left: auto; }
  select.msort { display: none; background: var(--panel); border: 1px solid var(--line);
    color: var(--fg); padding: 6px 10px; border-radius: 6px; font: inherit; }

  .timebar { display: flex; gap: 14px; align-items: center; padding: 12px 22px;
    border-bottom: 1px solid var(--line); }
  .timebar .lbl { color: var(--muted); font-size: 12px; white-space: nowrap; }
  .timebar .date { font-family: ui-monospace, Menlo, monospace; color: var(--accent);
    min-width: 96px; font-size: 13px; }
  input[type="range"] { flex: 1; accent-color: var(--accent); cursor: pointer; min-width: 160px; }
  button.mini { background: var(--panel); border: 1px solid var(--line); color: var(--fg);
    border-radius: 6px; padding: 5px 10px; font: inherit; cursor: pointer; }
  button.mini:hover { border-color: var(--muted); }
  .live { color: var(--muted); font-size: 12px; }
  .live.on { color: #3fb950; }

  /* No scroll container here on normal widths: overflow-x:auto would make .wrap a
     scroll container (overflow-y computes to auto), pinning position:sticky to .wrap
     instead of the viewport and breaking the sticky header + open row. The table only
     overflows horizontally between the card breakpoint (640px) and its min-width
     (720px), so scope the horizontal scroll to just that band. */
  .wrap { overflow-x: visible; }
  @media (min-width: 641px) and (max-width: 720px) { .wrap { overflow-x: auto; } }
  table { border-collapse: collapse; width: 100%; min-width: 720px; }
  th, td { padding: 6px 12px; text-align: left; border-bottom: 1px solid var(--line); white-space: nowrap; }
  th { position: sticky; top: 0; z-index: 3; background: var(--bg); cursor: pointer; user-select: none;
    font-weight: 600; color: var(--muted); }
  th.sorted { color: var(--fg); }
  th .arrow { color: var(--accent); }
  td.num, th.num { text-align: right; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  tr.rider-row:hover { background: var(--panel); cursor: pointer; }
  tr.rider-row.open { background: #1c2333; }
  /* Open rider row stays pinned under the header while you read its details,
     so it's always clear whose card is expanded. */
  tr.rider-row.open > td { position: sticky; top: var(--head-h, 33px); z-index: 2;
    background: #1c2333; box-shadow: 0 1px 0 var(--hi); }
  tr.rider-row.inactive td { color: var(--muted); }
  .elo-delta { font-size: 11px; margin-left: 6px; font-variant-numeric: tabular-nums; cursor: help; }
  .elo-delta.up { color: #3fb950; }
  .elo-delta.down { color: #f85149; }
  .elo-delta.flat { color: var(--muted); }
  tr.rider-row.inactive .elo-delta { opacity: 0.65; }
  .rank-col { color: var(--muted); }
  .detail td { background: var(--panel); }
  .chart-box { padding: 10px 4px; }
  .chart-title { color: var(--muted); font-size: 12px; margin-bottom: 6px; }
  svg { display: block; max-width: 100%; }
  .axis { stroke: var(--line); }
  .gridtext { fill: var(--muted); font: 10px ui-monospace, monospace; }
  .line { fill: none; stroke: var(--hi); stroke-width: 1.5; }
  .peak { fill: var(--accent); }
  .asof { stroke: var(--accent); stroke-dasharray: 3 3; }
  .asofdot { fill: var(--accent); }
  .dot { fill: var(--hi); opacity: .4; pointer-events: none; }
  .dot-sel { fill: var(--accent); opacity: 1; }
  .hover { stroke: var(--muted); stroke-dasharray: 2 2; pointer-events: none; }
  .hoverdot { fill: var(--hi); stroke: var(--bg); stroke-width: 1.5; pointer-events: none; }
  .hoverlabel { fill: var(--fg); font: 11px ui-monospace, monospace; pointer-events: none; }
  .hoverlabel-bg { fill: var(--bg); opacity: .85; pointer-events: none; }
  .hit { fill: transparent; cursor: pointer; }

  .heats-box { margin-top: 12px; }
  .heats-box .chart-title { margin-bottom: 8px; }
  .heats-scroll { overflow-x: auto; }
  .heats-box table { border-collapse: collapse; width: 100%; min-width: 640px; }
  .heats-box th, .heats-box td { padding: 4px 10px; text-align: left;
    border-bottom: 1px solid var(--line); white-space: nowrap; }
  .heats-box th { position: static; background: transparent; color: var(--muted);
    font-weight: 600; cursor: default; font-size: 12px; }
  .heats-box td.num, .heats-box th.num { text-align: right;
    font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  .heats-box td.excl { color: var(--accent); }
  .heats-box td.elo { font-variant-numeric: tabular-nums; }
  .heats-box td.elo-up { color: #3fb950; }
  .heats-box td.elo-down { color: #f85149; }
  .heats-box td.elo-flat { color: var(--muted); }
  .heats-box .lineup { white-space: normal; color: var(--muted); font-size: 12px; }
  .heats-box .lineup .me { color: var(--fg); font-weight: 600; }
  .heats-box .lineup .excl { color: var(--accent); }
  .heats-box .lineup .subst { color: var(--muted); cursor: help; }
  .heats-pager { display: flex; gap: 10px; align-items: center; margin-top: 8px;
    color: var(--muted); font-size: 12px; }
  .heats-pager button[disabled] { opacity: .4; cursor: default; }
  .heats-filter { display: flex; gap: 8px; align-items: center; flex-wrap: wrap;
    margin-bottom: 8px; color: var(--muted); font-size: 12px; }
  .heats-filter input[type="date"] { background: var(--panel); border: 1px solid var(--line);
    color: var(--fg); padding: 3px 6px; border-radius: 6px; font: inherit; color-scheme: dark; }
  .heats-filter button[disabled] { opacity: .4; cursor: default; }

  /* ---------------- mobile (≤640px): ranking table becomes a stack of cards ------------- */
  /* All card rules are scoped with `.wrap > table > …` child combinators so the NESTED
     heat sub-table (inside a detail row) keeps its normal table layout + its own
     .heats-scroll{overflow-x:auto} containment and header. */
  @media (max-width: 640px) {
    header { padding: 14px 14px 8px; }
    .controls, .timebar { padding: 12px 14px; gap: 10px; }

    /* let the filter + slider use the full row */
    #filter { min-width: 0; width: 100%; }
    .count { margin-left: 0; }
    select.msort { display: block; }
    .timebar { flex-wrap: wrap; }
    input[type="range"] { flex: 1 1 100%; min-width: 0; order: 3; }

    /* kill the horizontal-scroll table; turn every top-level row into a card */
    .wrap { overflow-x: visible; }
    .wrap > table { display: block; min-width: 0; width: 100%; }
    .wrap > table > thead { display: none; }
    .wrap > table > tbody { display: block; width: 100%; }
    .wrap > table > tbody > tr { display: block; width: 100%; }

    tr.rider-row { border: 1px solid var(--line); border-radius: 8px; background: var(--panel);
      margin-bottom: 8px; padding: 8px 12px; }
    tr.rider-row.open { background: #1c2333; position: sticky; top: 4px; z-index: 2;
      box-shadow: 0 2px 8px rgba(0,0,0,0.4); }
    /* cards stack the cells vertically, so the per-cell sticky rule doesn't apply here */
    tr.rider-row.open > td { position: static; box-shadow: none; }

    .wrap > table > tbody > tr.rider-row > td { display: flex; justify-content: space-between;
      align-items: baseline; gap: 12px; white-space: normal; border: 0; padding: 2px 0; text-align: right; }
    .wrap > table > tbody > tr.rider-row > td::before { content: attr(data-label); color: var(--muted);
      font-size: 12px; font-weight: 400; text-align: left; font-family: -apple-system, system-ui, sans-serif; }

    /* rider name is the card title — full width, no label */
    .wrap > table > tbody > tr.rider-row > td:first-child { justify-content: flex-start;
      font-size: 15px; font-weight: 600; padding-bottom: 4px; }
    .wrap > table > tbody > tr.rider-row > td:first-child::before { content: none; }

    /* hide low-value columns on mobile (Peak date, From, To) */
    .wrap > table > tbody > tr.rider-row > td:nth-child(5),
    .wrap > table > tbody > tr.rider-row > td:nth-child(7),
    .wrap > table > tbody > tr.rider-row > td:nth-child(8) { display: none; }

    /* detail row (chart + heats) spans full width, no card chrome */
    .wrap > table > tbody > tr.detail > td { display: block; width: 100%; padding: 0; }
    .chart-box { padding: 6px 0; }
  }
</style>

<header>
  <h1>SGP Elo Ranking</h1>
  <div class="sub">Speedway Grand Prix heat-by-heat Elo · 1995–2026 · drag the slider to see the ranking at any date · click a rider for their curve</div>
  <div class="nav"><a href="./heats.html">browse the heats behind it →</a></div>
  <div class="sub" id="status"></div>
</header>

<div class="controls">
  <input id="filter" type="text" placeholder="filter by name…" autocomplete="off" />
  <label class="toggle" title="Zawodnik jest „aktywny”, jeśli wystąpił w co najmniej jednej z tylu ostatnich rund (licząc do wybranej daty). Nieaktywni mają wyszarzony wiersz — ich rating może być nieaktualny. Ustawienie zapisywane w przeglądarce.">active: ostatnie <input id="activeRounds" type="number" min="1" max="301" value="15" /> rund</label>
  <label class="toggle" title="Pokaż też nieaktywnych zawodników (wyszarzone wiersze). Domyślnie widoczni. Ustawienie zapisywane w przeglądarce."><input id="showInactive" type="checkbox" checked /> pokaż nieaktywnych</label>
  <select id="msort" class="msort" aria-label="sort by"></select>
  <span class="count" id="count"></span>
</div>

<div class="timebar">
  <span class="lbl">Elo as of</span>
  <span class="date" id="date">—</span>
  <input id="time" type="range" min="0" max="0" value="0" step="1" />
  <button class="mini" id="latest">Latest</button>
  <span class="live" id="live"></span>
</div>

<div class="wrap">
  <table>
    <thead><tr id="head"></tr></thead>
    <tbody id="body"></tbody>
  </table>
</div>

<script>
  // Static, server-free: all data comes from prepared JSON next to this page.
  const COLS = [
    { key: "rider", label: "Rider", num: false },
    { key: "elo", label: "Elo", num: true, asof: true },
    { key: "heats", label: "Heats", num: true, asof: true },
    { key: "peak_elo", label: "Peak", num: true },
    { key: "peak_date", label: "Peak date", num: false },
    { key: "win_rate", label: "Win%", num: true },
    { key: "first_season", label: "From", num: true },
    { key: "last_season", label: "To", num: true },
  ];

  let ranking = [];          // career rows from ranking.json
  let hist = {};             // rider -> [[date, elo, heats], ...]
  let dates = [];            // global sorted distinct race dates (slider stops)
  let idx = 0;               // current slider index
  let rows = [];             // merged rows for the selected date
  let sortKey = "elo", sortDir = -1, openRider = null;

  const seasonCache = new Map();     // season -> Promise(parsed json | null) — deduped lazy fetch
  const riderHeatsCache = new Map(); // rider  -> [heat records] (built once per rider)
  const HEATS_PER_PAGE = 10;
  let heatPage = 0;                  // current page for the open rider's heat table
  let heatFrom = null, heatTo = null; // date-range filter for the heat table (null = no bound)

  const $ = (id) => document.getElementById(id);
  const isLatest = () => idx === dates.length - 1;

  // index of the last history point with date <= target (binary search), or -1 if pre-debut
  function asOfIdx(points, target) {
    let lo = 0, hi = points.length - 1, ans = -1;
    while (lo <= hi) {
      const mid = (lo + hi) >> 1;
      if (points[mid][0] <= target) { ans = mid; lo = mid + 1; } else hi = mid - 1;
    }
    return ans;
  }

  // "active" = raced in one of the last N rounds. N is user-configurable (persisted).
  const ACTIVE_ROUNDS_KEY = "sgp.activeRounds", ACTIVE_ROUNDS_DEFAULT = 15;
  function activeRounds() {
    const v = parseInt($("activeRounds").value, 10);
    return Number.isFinite(v) && v > 0 ? v : ACTIVE_ROUNDS_DEFAULT;
  }

  function rebuild() {
    const target = dates[idx];
    $("date").textContent = target || "—";
    $("live").textContent = isLatest() ? "live (latest)" : "historical";
    $("live").className = "live" + (isLatest() ? " on" : "");
    // Start of the window of the last N rounds up to the selected date.
    const windowStart = dates[Math.max(0, idx - (activeRounds() - 1))];
    rows = [];
    for (const r of ranking) {
      const pts = hist[r.rider];
      const ai = pts ? asOfIdx(pts, target) : -1;
      if (ai < 0) continue;             // rider had not debuted by this date
      const p = pts[ai];
      // Net Elo change over the rider's last round (as-of point minus the one before it).
      const lastDelta = ai > 0 ? p[1] - pts[ai - 1][1] : null;
      // p[0] is the rider's most recent race-day on/before target; active if it
      // falls inside the recent-rounds window.
      rows.push({ ...r, elo: p[1], heats: p[2], lastDelta, active: p[0] >= windowStart });
    }
    render();
  }

  function renderHead() {
    const tr = $("head");
    tr.innerHTML = "";
    for (const c of COLS) {
      const th = document.createElement("th");
      let label = c.label;
      if (c.asof && !isLatest()) label += " @date";
      th.textContent = label;
      if (c.num) th.className = "num";
      if (c.key === sortKey) {
        th.classList.add("sorted");
        th.innerHTML += ' <span class="arrow">' + (sortDir === 1 ? "▲" : "▼") + "</span>";
      }
      th.onclick = () => {
        if (sortKey === c.key) sortDir = -sortDir;
        else { sortKey = c.key; sortDir = c.num ? -1 : 1; }
        render();
      };
      tr.appendChild(th);
    }
  }

  function visibleRows() {
    const q = $("filter").value.trim().toLowerCase();
    const showInactive = $("showInactive").checked;
    const out = rows.filter((r) => {
      if (!showInactive && !r.active) return false;
      if (q && !r.rider.toLowerCase().includes(q)) return false;
      return true;
    });
    out.sort((a, b) => {
      const x = a[sortKey], y = b[sortKey];
      const c = typeof x === "string" ? x.localeCompare(y) : x - y;
      return c * sortDir;
    });
    return out;
  }

  function fmt(col, v) {
    if (v === undefined || v === null) return "";
    if (col.key === "win_rate") return (v * 100).toFixed(1);
    return v;
  }

  function render() {
    renderHead();
    $("msort").value = sortKey;          // keep the mobile sort control in sync
    const vis = visibleRows();
    $("count").textContent = vis.length + " / " + rows.length + " riders";
    const body = $("body");
    body.innerHTML = "";
    vis.forEach((r, i) => {
      const tr = document.createElement("tr");
      tr.className = "rider-row" + (r.rider === openRider ? " open" : "") + (r.active ? "" : " inactive");
      tr.onclick = () => toggle(r.rider);
      for (const c of COLS) {
        const td = document.createElement("td");
        td.dataset.label = c.label;      // used by the mobile card layout (::before)
        if (c.num) td.className = "num";
        if (c.key === "rider") {
          td.innerHTML = '<span class="rank-col">' + (i + 1) + ".</span> " + escapeHtml(r.rider);
        } else if (c.key === "elo") {
          // Elo value + net change over the rider's last round.
          td.innerHTML = fmt(c, r[c.key]) + eloDeltaBadge(r.lastDelta);
        } else td.textContent = fmt(c, r[c.key]);
        tr.appendChild(td);
      }
      body.appendChild(tr);
      if (r.rider === openRider) body.appendChild(detailRow(r));
    });
    // Pin the open row exactly under the sticky header: match its sticky top to
    // the header's real height (font/zoom-proof, vs. a hard-coded guess).
    const headH = $("head").offsetHeight;
    if (headH) document.documentElement.style.setProperty("--head-h", headH + "px");
  }

  function detailRow(r) {
    const tr = document.createElement("tr");
    tr.className = "detail";
    const td = document.createElement("td");
    td.colSpan = COLS.length;
    const box = document.createElement("div");
    box.className = "chart-box";
    const heatsBox = document.createElement("div");
    heatsBox.className = "heats-box";
    const pts = hist[r.rider] || [];

    // Click a race-day on the chart → filter the heat table to that day (click the same
    // day again to clear). Redraw ONLY this rider's chart + heats — never a full render(),
    // which would rebuild all 269 rows and make the chart flicker/jump. The chart box has
    // a fixed aspect ratio, so redrawing it in place doesn't shift anything below it.
    const onPick = (dd) => {
      if (heatFrom === dd && heatTo === dd) { heatFrom = null; heatTo = null; }
      else { heatFrom = dd; heatTo = dd; }
      heatPage = 0;
      drawChart(box, r, pts, onPick);
      if (riderHeatsCache.has(r.rider)) renderHeats(heatsBox, r.rider);
    };
    drawChart(box, r, pts, onPick);
    td.appendChild(box);

    if (riderHeatsCache.has(r.rider)) {
      renderHeats(heatsBox, r.rider);          // cached → synchronous, survives re-renders
    } else {
      heatsBox.innerHTML = '<div class="chart-title">ładowanie biegów…</div>';
      loadRiderHeats(r.rider, r.first_season, r.last_season).then(() => {
        if (openRider === r.rider) renderHeats(heatsBox, r.rider);
      });
    }
    td.appendChild(heatsBox);

    tr.appendChild(td);
    return tr;
  }

  // The rider's most recent race-day on/before the timebar date (the day the chart's
  // as-of marker points at), or null if they hadn't debuted yet.
  function riderAsOfDate(rider) {
    const pts = hist[rider];
    if (!pts) return null;
    const ai = asOfIdx(pts, dates[idx]);
    return ai >= 0 ? pts[ai][0] : null;
  }

  function toggle(rider) {
    openRider = openRider === rider ? null : rider;
    heatPage = 0;                    // reset paging & date filter each time a rider is (re)opened
    // If the timebar is parked on a past date, focus the heats on the day shown on the
    // chart; at the latest date show the rider's whole heat history.
    heatFrom = heatTo = (openRider && !isLatest()) ? riderAsOfDate(openRider) : null;
    render();
  }

  function drawChart(box, r, pts, onPick) {
    if (!pts.length) { box.innerHTML = '<div class="chart-title">no history</div>'; return; }
    const W = 760, H = 200, padL = 44, padR = 12, padT = 12, padB = 22;
    const ys = pts.map((p) => p[1]);
    const minY = Math.min(1400, Math.min(...ys) - 10);
    const maxY = Math.max(1600, Math.max(...ys) + 10);
    const sx = (i) => padL + (i / Math.max(1, pts.length - 1)) * (W - padL - padR);
    const sy = (v) => padT + (1 - (v - minY) / (maxY - minY)) * (H - padT - padB);
    let d = "";
    pts.forEach((p, i) => { d += (i ? "L" : "M") + sx(i).toFixed(1) + " " + sy(p[1]).toFixed(1) + " "; });
    let grid = "";
    for (let g = 0; g <= 4; g++) {
      const v = minY + (g / 4) * (maxY - minY);
      const y = sy(v);
      grid += '<line class="axis" x1="' + padL + '" y1="' + y.toFixed(1) + '" x2="' + (W - padR) + '" y2="' + y.toFixed(1) + '"/>';
      grid += '<text class="gridtext" x="4" y="' + (y + 3).toFixed(1) + '">' + Math.round(v) + "</text>";
    }
    let peakIdx = 0;
    ys.forEach((v, i) => { if (v > ys[peakIdx]) peakIdx = i; });
    const peak = '<circle class="peak" cx="' + sx(peakIdx).toFixed(1) + '" cy="' + sy(ys[peakIdx]).toFixed(1) + '" r="3"/>';
    // one clickable dot per race-day; clicking sets the heat date filter (see detailRow)
    const selDate = (heatFrom && heatFrom === heatTo) ? heatFrom : null;
    let dots = "";
    pts.forEach((p, i) => {
      const sel = p[0] === selDate ? " dot-sel" : "";
      dots += '<circle class="dot' + sel + '" data-date="' + p[0] +
        '" cx="' + sx(i).toFixed(1) + '" cy="' + sy(p[1]).toFixed(1) + '" r="3">' +
        "<title>" + p[0] + " · Elo " + p[1] + "</title></circle>";
    });
    // as-of marker: last point on/before the selected date
    const target = dates[idx];
    let aIdx = -1;
    for (let i = 0; i < pts.length; i++) { if (pts[i][0] <= target) aIdx = i; else break; }
    let asof = "";
    if (aIdx >= 0) {
      const x = sx(aIdx);
      asof =
        '<line class="asof" x1="' + x.toFixed(1) + '" y1="' + padT + '" x2="' + x.toFixed(1) + '" y2="' + (H - padB) + '"/>' +
        '<circle class="asofdot" cx="' + x.toFixed(1) + '" cy="' + sy(pts[aIdx][1]).toFixed(1) + '" r="3.5"/>';
    }
    // transparent hover guide + full-area hit rect (drawn last = on top, so clicks land
    // everywhere — even over the peak/as-of dots that used to swallow them).
    const hover = '<line class="hover" x1="0" y1="' + padT + '" x2="0" y2="' + (H - padB) + '" style="display:none"/>';
    const hoverParts =
      '<circle class="hoverdot" r="3.5" cx="0" cy="0" style="display:none"/>' +
      '<rect class="hoverlabel-bg" x="0" y="0" width="0" height="0" rx="2" style="display:none"/>' +
      '<text class="hoverlabel" x="0" y="0" style="display:none"></text>';
    const hit = '<rect class="hit" x="0" y="0" width="' + W + '" height="' + H + '"/>';
    box.innerHTML =
      '<div class="chart-title">' + escapeHtml(r.rider) + " · " + pts.length +
      " race-days · career peak " + Math.round(r.peak_elo) + " @ " + r.peak_date +
      (aIdx >= 0 ? " · Elo " + pts[aIdx][1] + " on " + pts[aIdx][0] : "") + "</div>" +
      '<svg viewBox="0 0 ' + W + " " + H + '" preserveAspectRatio="xMidYMid meet">' +
      grid + '<path class="line" d="' + d + '"/>' + dots + peak + asof +
      '<text class="gridtext" x="' + padL + '" y="' + (H - 6) + '">' + pts[0][0] + "</text>" +
      '<text class="gridtext" x="' + (W - padR) + '" y="' + (H - 6) + '" text-anchor="end">' + pts[pts.length - 1][0] + "</text>" +
      hover + hoverParts + hit + "</svg>";

    // Map a pointer event to the nearest race-day index (x is index-based via sx()).
    const svg = box.querySelector("svg");
    const hoverEl = box.querySelector(".hover");
    const hoverDot = box.querySelector(".hoverdot");
    const labelEl = box.querySelector(".hoverlabel");
    const labelBg = box.querySelector(".hoverlabel-bg");
    const nearestIdx = (e) => {
      const p = svg.createSVGPoint();
      p.x = e.clientX; p.y = e.clientY;
      const u = p.matrixTransform(svg.getScreenCTM().inverse());
      const t = (u.x - padL) / Math.max(1, W - padL - padR);
      return Math.max(0, Math.min(pts.length - 1, Math.round(t * (pts.length - 1))));
    };
    const hitEl = box.querySelector(".hit");
    hitEl.addEventListener("pointermove", (e) => {
      const i = nearestIdx(e);
      const x = sx(i), y = sy(pts[i][1]);
      hoverEl.setAttribute("x1", x.toFixed(1)); hoverEl.setAttribute("x2", x.toFixed(1));
      hoverEl.style.display = "";
      hoverDot.setAttribute("cx", x.toFixed(1)); hoverDot.setAttribute("cy", y.toFixed(1));
      hoverDot.style.display = "";
      // Date (+ Elo) label near the top of the guide; flip side & anchor near edges.
      const text = pts[i][0] + " · " + pts[i][1];
      const rightSide = x > W / 2;
      const lx = rightSide ? x - 6 : x + 6;
      labelEl.textContent = text;
      labelEl.setAttribute("x", lx.toFixed(1));
      labelEl.setAttribute("y", (padT + 9).toFixed(1));
      labelEl.setAttribute("text-anchor", rightSide ? "end" : "start");
      labelEl.style.display = "";
      // Backing rectangle sized from the rendered text so it stays legible over the line.
      const bb = labelEl.getBBox();
      labelBg.setAttribute("x", (bb.x - 3).toFixed(1));
      labelBg.setAttribute("y", (bb.y - 1).toFixed(1));
      labelBg.setAttribute("width", (bb.width + 6).toFixed(1));
      labelBg.setAttribute("height", (bb.height + 2).toFixed(1));
      labelBg.style.display = "";
    });
    hitEl.addEventListener("pointerleave", () => {
      hoverEl.style.display = "none"; hoverDot.style.display = "none";
      labelEl.style.display = "none"; labelBg.style.display = "none";
    });
    if (onPick) hitEl.addEventListener("click", (e) => onPick(pts[nearestIdx(e)][0]));
  }

  // Lazily fetch one season's heat file, deduping concurrent/repeat requests.
  // Mirrors the per-season Map cache used in heats.html. Missing seasons cache null.
  function fetchSeason(season) {
    let p = seasonCache.get(season);
    if (p) return p;
    p = fetch("./data/heats/" + season + ".json", { cache: "no-cache" })
      .then((r) => (r.ok ? r.json() : null))
      .catch(() => null);
    seasonCache.set(season, p);
    return p;
  }

  // Build (and cache) a rider's flat, newest-first list of the individual heats they rode,
  // by scanning only the season files spanning their career and filtering rows by name.
  function loadRiderHeats(rider, first, last) {
    if (riderHeatsCache.has(rider)) return Promise.resolve(riderHeatsCache.get(rider));
    const seasons = [];
    for (let s = first; s <= last; s++) seasons.push(s);
    return Promise.all(seasons.map(fetchSeason)).then((files) => {
      const out = [];
      for (const f of files) {
        if (!f || !f.rounds) continue;
        for (const rnd of f.rounds) {
          for (const h of rnd.heats) {
            const mine = h.rows.find((row) => row[1] === rider);
            if (!mine) continue;
            out.push({
              date: rnd.date, event: rnd.name, venue: rnd.venue,
              no: h.no, phase: h.phase,
              gate: mine[0], pts: mine[2], pos: mine[3], rank: mine[4], elo: mine[5],
              rows: h.rows, subs: h.subs || null,
            });
          }
        }
      }
      // Newest tournament first; within a tournament order by importance
      // (final → semi → main), and within a phase by heat number descending.
      const phaseRank = (p) => (p === "final" ? 0 : p === "semi" ? 1 : 2);
      out.sort((a, b) =>
        a.date !== b.date ? (a.date < b.date ? 1 : -1)
          : phaseRank(a.phase) !== phaseRank(b.phase) ? phaseRank(a.phase) - phaseRank(b.phase)
            : b.no - a.no);
      riderHeatsCache.set(rider, out);
      return out;
    });
  }

  // Render the current page of the open rider's heat table into `container`.
  // Pager buttons re-call this directly (no full render()) so paging is snappy.
  function renderHeats(container, rider) {
    if (rider !== openRider) return;
    const all = riderHeatsCache.get(rider) || [];
    if (!all.length) {
      container.innerHTML = '<div class="chart-title">brak danych o biegach</div>';
      return;
    }
    // Optional date-range filter (both bounds default to null = whole career).
    const filtered = all.filter((h) =>
      (!heatFrom || h.date >= heatFrom) && (!heatTo || h.date <= heatTo));
    const minD = all[all.length - 1].date, maxD = all[0].date; // list is newest-first
    const filterHtml =
      '<div class="heats-filter">zakres dat: ' +
      '<input type="date" data-f="from" min="' + minD + '" max="' + maxD + '"' +
      (heatFrom ? ' value="' + heatFrom + '"' : "") + "> – " +
      '<input type="date" data-f="to" min="' + minD + '" max="' + maxD + '"' +
      (heatTo ? ' value="' + heatTo + '"' : "") + ">" +
      ' <button class="mini" data-nav="clear"' + (!heatFrom && !heatTo ? " disabled" : "") + ">wyczyść</button>" +
      "</div>";
    const titleHtml =
      '<div class="chart-title">' + escapeHtml(rider) + " · " + filtered.length +
      (filtered.length !== all.length ? " z " + all.length : "") +
      " biegów · najnowsze u góry</div>";

    if (!filtered.length) {
      container.innerHTML = titleHtml + filterHtml +
        '<div class="chart-title">brak biegów w wybranym zakresie</div>';
      bindHeatsControls(container, rider, 1);
      return;
    }

    const pages = Math.max(1, Math.ceil(filtered.length / HEATS_PER_PAGE));
    if (heatPage >= pages) heatPage = pages - 1;
    if (heatPage < 0) heatPage = 0;
    const start = heatPage * HEATS_PER_PAGE;
    const slice = filtered.slice(start, start + HEATS_PER_PAGE);

    let rowsHtml = "";
    for (const h of slice) {
      const excl = h.pos != null && !/^\d+$/.test(String(h.pos));
      const finish = h.pos != null ? String(h.pos).toUpperCase() : (h.rank != null ? h.rank : "");
      // Who came in for whom (reserve substitutions), computed at build time.
      const cameInFor = new Map(), replacedBy = new Map();
      for (const pair of (h.subs || [])) { cameInFor.set(pair[1], pair[0]); replacedBy.set(pair[0], pair[1]); }
      const lineup = h.rows.slice()
        .sort((a, b) => (a[4] == null ? 99 : a[4]) - (b[4] == null ? 99 : b[4]))
        .map((row) => {
          // A letter finishing code (x/r/tt/t/d/m …) means excluded — show the code,
          // not the rank number (those riders are not counted in Elo).
          const rExcl = row[3] != null && !/^\d+$/.test(String(row[3]));
          const place = rExcl ? String(row[3]).toUpperCase() : (row[4] != null ? row[4] : "?");
          let label = place + ". " + escapeHtml(row[1]);
          const out = replacedBy.get(row[1]);      // this rider was excluded, replaced by …
          const inFor = cameInFor.get(row[1]);     // this rider came in for …
          if (inFor) label += ' <span class="subst" title="wjechał za ' + escapeHtml(inFor) + '">↺</span>';
          const cls = (row[1] === rider ? "me " : "") + (rExcl ? "excl" : "");
          const title = out ? ' title="zastąpił go ' + escapeHtml(out) + '"' : "";
          return cls.trim() || title ? '<span class="' + cls.trim() + '"' + title + ">" + label + "</span>" : label;
        })
        .join("  ");
      rowsHtml +=
        "<tr>" +
        "<td>" + h.date + "</td>" +
        '<td title="' + escapeHtml(h.event || "") + '">' + escapeHtml(shortEvent(h.event)) + "</td>" +
        "<td>#" + h.no + " " + escapeHtml(h.phase || "") + "</td>" +
        '<td class="num">' + (h.gate != null ? h.gate : "—") + "</td>" +
        '<td class="num">' + (h.pts != null ? h.pts : "—") + "</td>" +
        '<td class="num' + (excl ? " excl" : "") + '">' + finish + "</td>" +
        eloCell(h.elo) +
        '<td class="lineup">' + lineup + "</td>" +
        "</tr>";
    }

    container.innerHTML =
      titleHtml + filterHtml +
      '<div class="heats-scroll"><table>' +
      "<thead><tr><th>Data</th><th>Runda</th><th>Bieg</th>" +
      '<th class="num">Pole</th><th class="num">Pkt</th><th class="num">Miejsce</th>' +
      '<th class="num">Elo Δ</th>' +
      "<th>Skład (kolejność)</th></tr></thead><tbody>" +
      rowsHtml +
      "</tbody></table></div>" +
      '<div class="heats-pager">' +
      '<button class="mini" data-nav="prev"' + (heatPage <= 0 ? " disabled" : "") + ">‹ poprz.</button>" +
      "<span>" + (heatPage + 1) + " / " + pages + "</span>" +
      '<button class="mini" data-nav="next"' + (heatPage >= pages - 1 ? " disabled" : "") + ">nast. ›</button>" +
      "</div>";

    bindHeatsControls(container, rider, pages);
  }

  // Wire the date-range inputs, clear button, and pager for the open rider's heat table.
  // Each control resets to page 1 (except the pager itself) and re-renders in place.
  function bindHeatsControls(container, rider, pages) {
    const fromEl = container.querySelector('[data-f="from"]');
    const toEl = container.querySelector('[data-f="to"]');
    const clr = container.querySelector('[data-nav="clear"]');
    const prev = container.querySelector('[data-nav="prev"]');
    const next = container.querySelector('[data-nav="next"]');
    if (fromEl) fromEl.onchange = () => { heatFrom = fromEl.value || null; heatPage = 0; renderHeats(container, rider); };
    if (toEl) toEl.onchange = () => { heatTo = toEl.value || null; heatPage = 0; renderHeats(container, rider); };
    if (clr) clr.onclick = () => { heatFrom = null; heatTo = null; heatPage = 0; renderHeats(container, rider); };
    if (prev) prev.onclick = () => { if (heatPage > 0) { heatPage--; renderHeats(container, rider); } };
    if (next) next.onclick = () => { if (heatPage < pages - 1) { heatPage++; renderHeats(container, rider); } };
  }

  // Net Elo change over a rider's last round, as a small coloured, arrowed badge
  // shown next to their current Elo in the main table. null/0-history → nothing.
  function eloDeltaBadge(d) {
    if (d == null) return "";
    const r = Math.round(d);
    if (r > 0) return '<span class="elo-delta up" title="zmiana Elo w ostatniej rundzie">▲+' + r + "</span>";
    if (r < 0) return '<span class="elo-delta down" title="zmiana Elo w ostatniej rundzie">▼' + r + "</span>"; // r carries its own minus sign
    return '<span class="elo-delta flat" title="zmiana Elo w ostatniej rundzie">→0</span>';
  }

  // One heat's Elo change as a coloured, arrowed cell. null = rider not rated
  // for this heat (e.g. a solo/void heat that never entered the engine).
  function eloCell(d) {
    if (d == null) return '<td class="num elo">—</td>';
    const r = Math.round(d);
    if (r > 0) return '<td class="num elo elo-up">▲ +' + r + "</td>";
    if (r < 0) return '<td class="num elo elo-down">▼ ' + r + "</td>"; // r carries its own minus sign
    return '<td class="num elo elo-flat">→ 0</td>';
  }

  function escapeHtml(s) {
    return s.replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  }

  // Trim year + sponsor cruft from event names:
  //   "2026 WWK Schwaiger & Partner FIM Speedway GP of Germany - Landshut" → "SGP of Germany - Landshut"
  // Older names that don't follow the "…GP/Grand Prix of <Country>" pattern are left as-is.
  // Collapse any historical event name to "SGP <miejsce>", preferring the host
  // city/venue and falling back to the country/region. The full name stays in the
  // cell's title=. Covers dashed modern names ("... GP of Poland - Torun"), venues
  // ("... at Vojens Speedway Center"), Polish locatives ("... w Toruniu") and the
  // older "<Adjective> Speedway Grand Prix" forms.
  function shortEvent(name) {
    if (!name) return "";
    let s = String(name).replace(/[‒-―]/g, "-").replace(/\s+/g, " ").trim();

    // Host towns — restore diacritics, fold inflections/venues to one spelling.
    var CITY = {
      "torun": "Toruń", "toruniu": "Toruń", "toruń": "Toruń",
      "wroclaw": "Wrocław", "wroclawiu": "Wrocław", "wrocławiu": "Wrocław", "wrocław": "Wrocław",
      "gorzow": "Gorzów", "gorzów": "Gorzów", "gorzowie": "Gorzów",
      "warsaw": "Warszawa", "warszawa": "Warszawa", "warszawie": "Warszawa",
      "lublin": "Lublin", "lublinie": "Lublin", "bydgoszcz": "Bydgoszcz",
      "vojens": "Vojens",
      "prague": "Praga", "pradze": "Praga", "pragueue": "Praga", "praga": "Praga",
      "malilla": "Målilla", "målilla": "Målilla", "malilli": "Målilla", "malila": "Målilla",
      "cardiff": "Cardiff", "riga": "Riga", "teterow": "Teterow", "landshut": "Landshut",
      "manchester": "Manchester", "horsens": "Horsens",
      "daugavpils": "Daugavpils", "daugavipils": "Daugavpils",
      "krsko": "Krško", "krško": "Krško", "togliatti": "Togliatti", "terenzano": "Terenzano",
      "stockholm": "Stockholm", "melbourne": "Melbourne", "gorican": "Goričan", "goričan": "Goričan"
    };
    // Cities that appear as a bare token inside a name (before "FIM ...").
    var EMBEDDED = {
      "Toruń": "Toruń", "Gorzów": "Gorzów", "Wrocław": "Wrocław",
      "Warszawa": "Warszawa", "Warsaw": "Warszawa",
      "Stockholm": "Stockholm", "Bydgoszcz": "Bydgoszcz", "Lublin": "Lublin"
    };
    // Venue -> host city.
    var VENUE = {
      "vojens speedway center": "Vojens", "stadion narodowy": "Warszawa",
      "stadion olimpijski": "Wrocław", "stadion markéta": "Praga", "stadion marketa": "Praga",
      "stadion matija gubca": "Krško", "motoarena toruń im. mariana rosego": "Toruń",
      "mariana rose motoarena": "Toruń", "edward jancarz stadion": "Gorzów",
      "millenium stadium": "Cardiff", "millennium stadium": "Cardiff", "casa arena": "Horsens",
      "g&b arena": "Güstrow", "hz bygg arena": "Målilla", "arena am kellerholz": "Wiener Neustadt"
    };
    // Country / region normalisation.
    var COUNTRY = {
      poland: "Poland", polish: "Poland", polski: "Poland", polska: "Poland",
      denmark: "Denmark", danish: "Denmark", danmark: "Denmark", dannmark: "Denmark", dansk: "Denmark", danii: "Denmark",
      sweden: "Sweden", swedish: "Sweden", szwecji: "Sweden",
      "czech republic": "Czech Republic", czech: "Czech Republic", czechia: "Czech Republic",
      germany: "Germany", german: "Germany",
      "great britain": "Great Britain", british: "Great Britain", britain: "Great Britain",
      latvia: "Latvia", latvian: "Latvia", croatia: "Croatia", croatian: "Croatia",
      slovenia: "Slovenia", slovenian: "Slovenia",
      italy: "Italy", italian: "Italy", italia: "Italy", "włoch": "Italy",
      australia: "Australia", australian: "Australia", australi: "Australia",
      norway: "Norway", norwegian: "Norway", finland: "Finland", finnish: "Finland",
      "new zealand": "New Zealand", russia: "Russia", russian: "Russia", rosji: "Russia",
      austria: "Austria", austrian: "Austria", europe: "Europe", european: "Europe",
      scandinavia: "Scandinavia", scandinavian: "Scandinavia", nordic: "Nordic"
    };

    function cleanPlace(t) {
      return t.replace(/\bR\d+\b.*$/i, "").replace(/\bwielkopolski\b/i, "")
        .replace(/\bwlkp\.?/i, "").replace(/\s+/g, " ").trim();
    }
    function asCity(t) { return CITY[cleanPlace(t).toLowerCase()] || null; }
    function out(place) { return "SGP " + place; }

    // 1) City after a dash: "... of Poland - Torun", "3. runda Grand Prix - Wrocław".
    var dash = s.match(/-\s*([^-]+)$/);
    if (dash) { var c1 = asCity(dash[1]); if (c1) return out(c1); }

    // 2) Venue: "... Speedway Grand Prix at <venue>".
    var at = s.match(/\bat\s+(.+)$/i);
    if (at) {
      var key = at[1].toLowerCase().trim();
      if (VENUE[key]) return out(VENUE[key]);
      var c2 = asCity(at[1]); if (c2) return out(c2);
    }

    // 3) Locative city: Polish "w/we <miasto>" or English "in <city>".
    var loc = s.match(/\b(?:w|we|in)\s+(.+?)\s*$/i);
    if (loc) { var c3 = asCity(loc[1]); if (c3) return out(c3); }

    // 4) Embedded host city anywhere in the name.
    for (var token in EMBEDDED) {
      if (new RegExp("(^|\\s)" + token + "(\\s|$)", "u").test(s)) return out(EMBEDDED[token]);
    }

    // 5) "... of <Country>".
    var of = s.match(/\bof\s+(?:the\s+)?([A-Za-zÀ-ž ]+?)\s*$/i);
    if (of) { var co = COUNTRY[of[1].trim().toLowerCase()]; if (co) return out(co); }

    // 6) National adjective / region token anywhere (longest key first).
    var keys = Object.keys(COUNTRY).sort(function (a, b) { return b.length - a.length; });
    for (var i = 0; i < keys.length; i++) {
      if (new RegExp("(^|\\s)" + keys[i] + "(\\s|$)", "i").test(s)) return out(COUNTRY[keys[i]]);
    }

    // 7) Fallback: strip boilerplate, return whatever remains (or the raw name).
    var rest = s.replace(/^\d{4}\s+/, "")
      .replace(/\bFIM\b|\bSpeedway\b|\bGrand Prix\b|\bSGP\b|\bGP\b|\bof\b|\brunda\b|\d+\.?/gi, " ")
      .replace(/\s+/g, " ").trim();
    return rest ? "SGP " + rest : s;
  }

  $("filter").addEventListener("input", render);
  // Restore the saved active-window (falls back to the HTML default of 15).
  {
    const saved = parseInt(localStorage.getItem(ACTIVE_ROUNDS_KEY), 10);
    if (Number.isFinite(saved) && saved > 0) $("activeRounds").value = saved;
  }
  // Retune the "active" window: persist the value and recompute row activity.
  $("activeRounds").addEventListener("input", () => {
    localStorage.setItem(ACTIVE_ROUNDS_KEY, activeRounds());
    if (dates.length) rebuild();   // rebuild recomputes each row's `active` flag
  });
  // Show/hide inactive riders (default hidden). Persisted like the active-window.
  const SHOW_INACTIVE_KEY = "sgp.showInactive";
  $("showInactive").checked = localStorage.getItem(SHOW_INACTIVE_KEY) !== "0";
  $("showInactive").addEventListener("change", () => {
    localStorage.setItem(SHOW_INACTIVE_KEY, $("showInactive").checked ? "1" : "0");
    render();
  });
  $("time").addEventListener("input", (e) => {
    idx = +e.target.value;
    // Keep the open rider's heat filter locked to the date shown on the chart (cleared at
    // the latest date, so you see their full history there).
    if (openRider) { heatFrom = heatTo = isLatest() ? null : riderAsOfDate(openRider); heatPage = 0; }
    rebuild();
  });
  $("latest").addEventListener("click", () => {
    idx = dates.length - 1; $("time").value = idx;
    if (openRider) { heatFrom = heatTo = null; heatPage = 0; }   // back to full history
    rebuild();
  });

  // Mobile sort control — column headers are hidden in the card layout, so mirror the
  // sortable columns into a <select>. Selecting a column sorts by it (numeric cols default
  // descending, text ascending), matching a header click.
  $("msort").innerHTML = COLS.map((c) => '<option value="' + c.key + '">' + c.label + "</option>").join("");
  $("msort").addEventListener("change", (e) => {
    const c = COLS.find((c) => c.key === e.target.value);
    sortKey = c.key; sortDir = c.num ? -1 : 1;
    render();
  });

  Promise.all([
    fetch("./data/ranking.json", { cache: "no-cache" }).then((r) => r.json()),
    fetch("./data/history.json", { cache: "no-cache" }).then((r) => r.json()),
  ])
    .then(([rk, h]) => {
      ranking = rk;
      hist = h.riders;
      dates = h.dates;
      idx = dates.length - 1;
      const t = $("time");
      t.max = String(dates.length - 1);
      t.value = String(idx);
      rebuild();
    })
    .catch((e) => { $("body").innerHTML = '<tr><td colspan="8">Failed to load data: ' + e + "</td></tr>"; });

  // Last-updated badge. Best-effort: if status.json is missing (older cache)
  // the header line simply stays empty rather than breaking the page.
  const plDate = (s) => {
    const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(s || "");
    return m ? m[3] + "." + m[2] + "." + m[1] : null;
  };
  fetch("./data/status.json", { cache: "no-cache" })
    .then((r) => (r.ok ? r.json() : null))
    .then((s) => {
      if (!s) return;
      const parts = [];
      const upd = plDate(s.built_at);
      const last = plDate(s.last_event);
      const next = plDate(s.next_event);
      if (upd) parts.push("Zaktualizowano: " + upd);
      if (last) parts.push("dane do " + last);
      if (next) parts.push("następna runda: " + next);
      if (parts.length) $("status").textContent = parts.join(" · ");
    })
    .catch(() => {});
</script>
